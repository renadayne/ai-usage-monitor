[package]
name = "ai-usage-monitor"
version = "0.1.0"
description = "Tray app that tracks usage of AI coding tools"
authors = ["renadayne"]
license = "MIT"
edition = "2021"

[lib]
name = "ai_usage_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
