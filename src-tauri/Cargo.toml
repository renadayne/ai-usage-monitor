[package]
name = "ai-usage-monitor"
version = "0.1.0"
description = "Tray app that tracks usage of AI coding tools"
authors = ["renadayne"]
license = "MIT"
edition = "2021"

[lib]
name = "ai_usage_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.8.1"
tokio = { version = "1.54.1", features = ["time", "sync", "macros", "rt"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util", "rt-multi-thread"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Foundation"] }
